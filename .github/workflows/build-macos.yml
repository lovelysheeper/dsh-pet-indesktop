name: Build macOS App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon（arm64）；Intel 用户请用源码运行

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 imageio-ffmpeg pillow pyinstaller pytest keyring certifi

      - name: Generate app icon (.icns)
        run: python scripts/make_icon.py --icns

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # 只构建 webm-chat 一个变体（WebM 素材 + AI 对话）。
      # 不再生成 GIF 素材，也不再构建 webm / gif-chat / gif 变体，
      # 避免把 ~800MB GIF 素材打进产物，导致体积暴涨到 ~1.7GB。
      - name: Build webm-chat onedir .app
        run: |
          VARIANT="webm-chat"
          echo "VARIANT = '$VARIANT'" > packaging/build_variant.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --paths . \
            --collect-all imageio_ffmpeg \
            --collect-all certifi \
            --add-data "assets/sounds:assets/sounds" \
            --add-data "assets/chat:assets/chat" \
            --add-data "pet/chat/styles.qss:pet/chat" \
            --name "dsh-pet-standalone-$VARIANT" \
            --icon assets/icon.icns \
            --add-data "assets/characters:assets/characters" \
            packaging/pet_entry.py
          if [ $? -ne 0 ]; then echo "::error::$VARIANT 构建失败"; exit 1; fi

      - name: Verify pet module collected
        run: |
          APP="dsh-pet-standalone-webm-chat"
          WARN="build/$APP/warn-$APP.txt"
          if [ -f "$WARN" ] && grep -q "missing module named pet" "$WARN"; then
            echo "::error::$APP pet 模块未被 PyInstaller 收集"; cat "$WARN"; exit 1
          fi
          echo "$APP pet 模块已收集"

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - "dist/dsh-pet-standalone-webm-chat.app"

      - name: Package as zip
        run: |
          cd dist
          ditto -c -k --keepParent "dsh-pet-standalone-webm-chat.app" \
            "dsh-pet-standalone-webm-chat-macos-arm64.zip"

      - name: Verify zip preserves executable permission
        run: |
          ZIP="dist/dsh-pet-standalone-webm-chat-macos-arm64.zip"
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          cd /tmp/verify
          unzip -q "$GITHUB_WORKSPACE/$ZIP"
          APP="dsh-pet-standalone-webm-chat.app"
          BIN="$APP/Contents/MacOS/${APP%.app}"
          ls -l "$BIN"
          if [ ! -x "$BIN" ]; then
            echo "::error::$ZIP 解压后二进制丢失可执行权限"; exit 1
          fi
          echo "$ZIP 可执行权限保留"
          cd "$GITHUB_WORKSPACE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-standalone-macos-arm64
          path: dist/*.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
